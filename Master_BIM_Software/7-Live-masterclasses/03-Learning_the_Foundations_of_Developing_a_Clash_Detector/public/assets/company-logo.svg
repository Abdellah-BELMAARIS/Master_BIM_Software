<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 54" width="245" height="54" preserveAspectRatio="xMinYMid meet">
  <defs>
    <linearGradient id="logoBadgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="logoCubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="logoCubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="logoCubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>
    <style>
      .logo-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 19px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.06em; }
      .logo-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16.5px; font-weight: 800; fill: #38bdf8; letter-spacing: 0.14em; }
    </style>
  </defs>

  <!-- Outer Precision BIM Badge Frame -->
  <rect x="2" y="3" width="48" height="48" rx="6" fill="url(#logoBadgeBg)" stroke="#2563eb" stroke-width="1.75"/>
  <rect x="5" y="6" width="42" height="42" rx="4" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1"/>

  <!-- Structural BIM Isometric 3D Shaded Cube -->
  <!-- Top Face -->
  <polygon points="26,11 40,19 26,27 12,19" fill="url(#logoCubeTop)" />
  <!-- Left Face -->
  <polygon points="12,19 26,27 26,43 12,35" fill="url(#logoCubeLeft)" />
  <!-- Right Face -->
  <polygon points="26,27 40,19 40,35 26,43" fill="url(#logoCubeRight)" />

  <!-- Outer Wireframe & Inner Axis Edges -->
  <path d="M26 11 L40 19 L40 35 L26 43 L12 35 L12 19 Z" fill="none" stroke="#38bdf8" stroke-width="1.85" stroke-linejoin="round"/>
  <path d="M12 19 L26 27 L40 19 M26 27 L26 43" fill="none" stroke="#60a5fa" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- CAD Structural Node Vertices -->
  <circle cx="26" cy="11" r="1.7" fill="#f8fafc"/>
  <circle cx="26" cy="27" r="2" fill="#38bdf8"/>
  <circle cx="12" cy="19" r="1.5" fill="#93c5fd"/>
  <circle cx="40" cy="19" r="1.5" fill="#93c5fd"/>
  <circle cx="26" cy="43" r="1.5" fill="#93c5fd"/>

  <!-- Brand Typography (Fits cleanly inside 245px width with zero clipping) -->
  <text x="60" y="25" class="logo-title">CONSTRUCTION</text>
  <text x="60" y="44" class="logo-sub">COMPANY</text>
</svg>
