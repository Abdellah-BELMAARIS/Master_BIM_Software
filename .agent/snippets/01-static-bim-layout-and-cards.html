<!--
  Snippet 01: Static BIM Projects Layout, Responsive Grid & Modal Form (Module 1)
  Covers Lessons 2.1 - 2.11 & 3.1 - 3.2:
  - Semantic HTML5 layout (<aside>, <main>, <header>, <dialog>)
  - CSS Variables, Flexbox Header/Sidebar & Responsive CSS Grid (repeat(auto-fill, minmax(300px, 1fr)))
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIM Projects Dashboard — Module 1 Reference</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" />
  <style>
    :root {
      --bg-dark: #141619;
      --bg-card: #1f2328;
      --bg-sidebar: #181b1f;
      --primary: #029ae0;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3239;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text-main);
    }

    /* Sidebar (Lesson 2.7) */
    aside#sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Main Content & Header (Lesson 2.8) */
    main.content { display: flex; flex-direction: column; }
    header.page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    /* Responsive Projects Grid & Project Card (Lessons 2.9 - 2.10) */
    #projects-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .project-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h2>🏗️ BIMPulse Hub</h2>
    <nav>
      <ul style="list-style: none; display: grid; gap: 0.75rem;">
        <li><span class="material-icons-round">apartment</span> Projects</li>
        <li><span class="material-icons-round">people</span> Team</li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <header class="page-header">
      <div>
        <h1>BIM Projects</h1>
        <p style="color: var(--text-muted)">Manage IFC & Fragment models across active sites</p>
      </div>
      <button id="new-project-btn">+ New Project</button>
    </header>

    <section id="projects-list">
      <article class="project-card">
        <h3>Hospital Wing B — MEP Coordination</h3>
        <p style="color: var(--text-muted)">LOD 350 HVAC & Structural IFC Federation</p>
      </article>
    </section>
  </main>
</body>
</html>
